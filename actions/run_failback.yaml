---
  name: "Fail_Back"
  runner_type: "python-script"
  description: "Perform return to primary site"
  enabled: true
  entry_point: "run_failback.py"
  parameters:
    plan_name:
      type: "string"
      description: "DR Plan name"
      required: true
      default: "test"

    timeout:
      type: "integer"
      description: "Action timeout in seconds. Action will get killed if it doesn't finish in timeout seconds. Default is 24 hours (eq 86400)."
      default: 86400